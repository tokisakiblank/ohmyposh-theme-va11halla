"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true

[[blocks]]
type = "prompt"
alignment = "left"
leading_diamond = "<#7eb8da>┏</>"

[[blocks.segments]]
type = "os"
style = "diamond"
foreground = "#512BD4"
template = " {{ if .WSL }}WSL at {{ end }}{{.Icon}} "
powerline_symbol = ""
options = {}

[[blocks.segments]]
type = "session"
style = "plain"
foreground = "#7eb8da"
template = "[{{ .UserName }}@{{ .HostName }}]"

[[blocks.segments]]
type = "sysinfo"
style = "diamond"
foreground = "#be9ddf"
template = "[ RAM: {{ round .PhysicalPercentUsed .Precision }}%]"

[[blocks.segments]]
type = "shell"
style = "diamond"
foreground = "#512BD4"
template = "[ {{ .Name }}]"
powerline_symbol = ""

[[blocks.segments]]
type = "python"
style = "diamond"
foreground = "#3776AB"
template = "( {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }})"
powerline_symbol = ""

[[blocks.segments]]
type = "node"
style = "diamond"
foreground = "#68A063"
template = "( {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }})"
powerline_symbol = ""

[[blocks.segments]]
type = "rust"
style = "diamond"
foreground = "#B7410E"
template = "( {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }})"
powerline_symbol = ""

[[blocks.segments]]
type = "dart"
style = "diamond"
foreground = "#0175C2"
template = "( {{ .Full }})"
powerline_symbol = ""

[[blocks.segments]]
type = "go"
style = "diamond"
foreground = "#00ADD8"
template = "( {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }})"
powerline_symbol = ""

[[blocks.segments]]
type = "java"
style = "diamond"
foreground = "#EA2D2E"
template = "( {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }})"
powerline_symbol = ""

[[blocks.segments]]
type = "kotlin"
style = "diamond"
foreground = "#7F52FF"
template = "( {{ .Full }})"
powerline_symbol = ""

[[blocks.segments]]
type = "lua"
style = "diamond"
foreground = "#000080"
template = "( {{ .Full }})"
powerline_symbol = ""

[[blocks.segments]]
type = "zig"
style = "diamond"
foreground = "#F7A41D"
template = "( {{ .Full }})"
powerline_symbol = ""

[[blocks.segments]]
type = "dotnet"
style = "diamond"
foreground = "#512BD4"
template = "(.NET {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }})"
powerline_symbol = ""

[[blocks]]
type = "prompt"
alignment = "right"
newline = false

[[blocks.segments]]
type = "executiontime"
style = "diamond"
foreground = "#be9ddf"
template = "[<#ffffff></> {{ .FormattedMs }}s]"

[blocks.segments.options]
style = "dallas"
threshold = 0

[[blocks.segments]]
type = "time"
style = "diamond"
foreground = "#7eb8da"
template = "[{{ .CurrentDate | date .Format}}]"

[blocks.segments.options]
time_format = "15:04:05 MST"

[[blocks]]
type = "prompt"
alignment = "left"
newline = true
leading_diamond = "<#7eb8da>└─</>"

[[blocks.segments]]
type = "path"
style = "diamond"
foreground = "#7eb8da"
template = "[<#ffffff></> <#98bfad>{{ .Path }}</>]"

[blocks.segments.options]
style = "full"

[[blocks.segments]]
type = "git"
style = "plain"
foreground = "#ffa5d8"
template = "[<#ffffff>{{ .UpstreamIcon }} </>{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <#ffffff></> {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} <#ffffff></> {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} <#ffffff></> {{ .StashCount }}{{ end }}]"

[[blocks.segments]]
type = "gitversion"
style = "plain"
foreground = "#ffa5d8"
template = "  {{ .Major }}.{{ .Minor }}.{{ .Patch }} "
powerline_symbol = ""

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "root"
style = "diamond"
foreground = "#ffffff"
template = "<#ff0000>[#]</>"

[[blocks.segments]]
type = "status"
style = "diamond"
foreground = "#ffffff"
foreground_templates = ["{{ if eq .Code 0 }}#00ff00{{ else }}#ff0000{{ end }}"]
template = "[{{ if eq .Code 0 }}<#00ff00></>{{ else }}<#ff0000> {{reason .Code }}</>{{ end }}]"
powerline_symbol = ""

[blocks.segments.options]
always_enabled = true

[[blocks.segments]]
type = "text"
style = "diamond"
foreground = "#ffffff"
template = ">"

[transient_prompt]
template = "> "
foreground = "cyan"

[valid_line]
background = "transparent"
template = "> "

[error_line]
background = "transparent"
template = "<#ff0000></> "

[secondary_prompt]
background = "transparent"
template = " "

[debug_prompt]
template = "> "
